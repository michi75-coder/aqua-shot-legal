<script>
  // The address of each store page, once the app is published there. Left empty, the page says
  // the app is coming and sends nobody to a page that does not exist yet.
  var STORES = {
    ios: "",
    android: ""
  };

  var COPY = {
    fr: { tagline: "Compte ton eau. Même les soirs de fête.", soon: "Bientôt sur l'App Store et Google Play.", ios: "Télécharger dans l'App Store", android: "Disponible sur Google Play", legal: "Conditions et confidentialité", legalUrl: "../" },

  };

  var language = (navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
  var copy = COPY[language];
  document.documentElement.lang = language;
  document.getElementById("tagline").textContent = copy.tagline;
  document.getElementById("soon").textContent = copy.soon;
  document.getElementById("legal").textContent = copy.legal;
  document.getElementById("legal").href = copy.legalUrl;

  var agent = navigator.userAgent || "";
  // An iPad says it is a Mac: the touch screen gives it away.
  var isIos = /iPhone|iPad|iPod/.test(agent) || (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(agent);
  var platform = isIos ? "ios" : isAndroid ? "android" : null;

  // On a phone whose store page exists, go straight there.
  if (platform !== null && STORES[platform]) {
    window.location.replace(STORES[platform]);
  }

  var hasStore = false;
  ["ios", "android"].forEach(function (name) {
    if (!STORES[name]) { return; }
    var link = document.getElementById(name);
    link.href = STORES[name];
    link.textContent = copy[name];
    link.hidden = false;
    hasStore = true;
  });
  document.getElementById("soon").hidden = hasStore;
</script>
